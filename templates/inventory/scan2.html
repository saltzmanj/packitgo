{% extends "inventory/base.html" %}
{% block content %}

    <h2>Enter Inventory Details</h2>
    <form id="batchForm" method="POST" action="{% url 'inventory:MoveInventoryExecute' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="partNumber">Part Number</label>
            <input type="text" class="form-control" id="partNumber" name="partNumber" placeholder="Part Number" required value="{{ part_number }}">
        </div>
        <div class="form-group">
            <label for="batch">Batch</label>
            <input type="text" class="form-control" id="batch" name="batch" placeholder="Batch" required value="{{ batch }}">
        </div>
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" class="form-control" id="quantity" name="quantity" placeholder="Quantity" required value="{{ quantity }}">
        </div>
        <div class="form-group">
            <label for="from">From Location</label>
            <select class="form-control" id="from" name="from" required>
                <option value="">Select From Location</option>
                {% for location in locations.all %}
                    <option value="{{ location.locationName }}">{{ location.locationName }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="to">To Location</label>
            <select class="form-control" id="to" name="to" required>
                <option value="">Select To Location</option>
                {% for location in locations.all %}
                    <option value="{{ location.locationName }}">{{ location.locationName }}</option>
                {% endfor %}
            </select>
        </div>

        <input type="hidden" name="action_input" id="action_input" value="">
        <div class="form-group button-container">
            <button type="button" class="btn btn-secondary" onclick="submitForm('cancel')">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="submitForm('move')">Start Move</button>
        </div>
    </form>

    <script>
        function submitForm(action) {
            document.getElementById('action_input').value = action;
            document.getElementById('batchForm').submit();
        }

        document.getElementById("batchForm").addEventListener("submit", function(event) {
            // Remove the default form submission handler since we're handling it with the buttons now
        });
    </script>

{% endblock %}
